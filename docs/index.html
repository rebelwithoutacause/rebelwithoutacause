<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support Tedd</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #24283b 0%, #1a1b26 60%);
      color: #c0caf5;
    }
    .card {
      width: 100%;
      max-width: 560px;
      padding: 40px 32px;
      text-align: center;
      background: #1f2335;
      border: 1px solid #3b4261;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    h1 { margin: 0 0 8px; font-size: 2rem; color: #ffffff; }
    p { margin: 0 0 28px; font-size: 1.05rem; line-height: 1.5; color: #a9b1d6; }
    .label {
      margin-bottom: 10px;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #7aa2f7;
    }
    .iban {
      display: block;
      margin-bottom: 24px;
      padding: 16px;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: clamp(1.1rem, 4.5vw, 1.6rem);
      font-weight: 600;
      letter-spacing: 0.06em;
      word-break: break-all;
      color: #ffffff;
      background: #16161e;
      border: 1px solid #3b4261;
      border-radius: 12px;
      user-select: all;
    }
    button {
      padding: 14px 32px;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #7aa2f7, #bb9af7);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(122, 162, 247, 0.4); }
    button:focus-visible { outline: 3px solid #ffffff; outline-offset: 3px; }
    button.copied { background: linear-gradient(135deg, #9ece6a, #73daca); }
    .thanks { margin: 28px 0 0; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Support Me</h1>
    <p>☕ Enjoying my projects? Help fuel the next one! 🚀</p>
    <div class="label">🏦 IBAN</div>
    <code class="iban" id="iban">BG75STSA93000029979791</code>
    <button type="button" id="copy">📋 Copy IBAN</button>
    <p class="thanks">Thank you for being awesome! 🙌</p>
  </main>
  <script>
    const button = document.getElementById("copy");
    const iban = document.getElementById("iban").textContent.trim();

    function fallbackCopy() {
      const area = document.createElement("textarea");
      area.value = iban;
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      area.remove();
    }

    button.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(iban);
      } catch {
        fallbackCopy();
      }
      button.textContent = "✅ Copied!";
      button.classList.add("copied");
      setTimeout(() => {
        button.textContent = "📋 Copy IBAN";
        button.classList.remove("copied");
      }, 2000);
    });
  </script>
</body>
</html>
